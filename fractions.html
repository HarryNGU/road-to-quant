<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Fractions Drill</title>
<meta name="theme-color" content="#14171C">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#14171C;--panel:#1C2027;--fg:#F2F0EB;--muted:#9AA0A8;--line:#2E343D;--blue:#5B9BF0;--green:#5CC783;--red:#EF6B6B;--amber:#E8B04B}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:16px;max-width:520px;margin:auto;min-height:100vh}
a{color:var(--blue)}
h1{font-size:13px;letter-spacing:.12em;color:var(--muted);font-weight:600;margin:4px 4px 14px}
.decks{display:grid;gap:8px}
.deck{background:var(--panel);border:0;border-radius:14px;padding:16px;text-align:left;color:var(--fg);font:inherit;width:100%}
.deck b{display:block;font-size:17px}.deck small{color:var(--muted)}
.deck:active{background:var(--line)}
.bar{display:flex;justify-content:space-between;color:var(--muted);font-size:14px;margin:0 4px 10px}
.track{height:6px;background:var(--line);border-radius:3px;margin:0 4px 18px;overflow:hidden}
.track i{display:block;height:100%;background:var(--blue);width:0;transition:width .2s}
.frac{display:flex;flex-direction:column;align-items:center;font:600 64px/1 Georgia,"Times New Roman",serif;margin:28px 0 22px}
.frac hr{width:110px;border:0;border-top:4px solid var(--fg);margin:10px 0}
input{width:100%;background:var(--panel);border:2px solid var(--line);border-radius:14px;color:var(--fg);font:600 30px/1 ui-monospace,Menlo,monospace;padding:14px;text-align:center;outline:none}
input:focus{border-color:var(--blue)}
.feedback{min-height:84px;margin:14px 4px;font-size:16px}
.ok{color:var(--green)}.no{color:var(--red)}.hint{color:var(--muted);font-size:14px;display:block;margin-top:4px}
.go{width:100%;border:0;border-radius:14px;padding:16px;font:600 17px system-ui;background:var(--blue);color:#0b0d10}
.go.secondary{background:var(--panel);color:var(--fg);margin-top:8px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 16px}
.stat{background:var(--panel);border-radius:14px;padding:14px;text-align:center}
.stat b{display:block;font-size:26px}.stat small{color:var(--muted)}
.miss{background:var(--panel);border-radius:12px;padding:10px 14px;margin-bottom:6px;display:flex;justify-content:space-between}
.miss span{color:var(--muted)}
.hist{color:var(--muted);font-size:14px;margin:18px 4px}
[hidden]{display:none!important}
</style></head><body>

<section id="menu">
  <h1>FRACTIONS → DECIMALS</h1>
  <div class="decks" id="decks"></div>
  <p class="hist" id="hist"></p>
  <p class="hist"><a href="./">← Road to Quant</a></p>
</section>

<section id="drill" hidden>
  <div class="bar"><span id="count"></span><span id="clock">0.0s</span></div>
  <div class="track"><i id="prog"></i></div>
  <div class="frac"><span id="num"></span><hr><span id="den"></span></div>
  <form id="form" autocomplete="off"><input id="ans" inputmode="decimal" placeholder="0.____" enterkeyhint="go"></form>
  <div class="feedback" id="fb"></div>
  <button class="go" id="next" hidden>Next</button>
</section>

<section id="done" hidden>
  <h1 id="doneTitle">SESSION DONE</h1>
  <div class="stats">
    <div class="stat"><b id="sScore"></b><small>correct</small></div>
    <div class="stat"><b id="sAvg"></b><small>avg time</small></div>
    <div class="stat"><b id="sSlow"></b><small>slowest</small></div>
  </div>
  <div id="misses"></div>
  <button class="go" id="again">Go again</button>
  <button class="go secondary" id="back">Change deck</button>
  <p class="hist" id="logged"></p>
</section>

<script>
const LOG_TOPIC = "rtq-log-auaxy0gbjsle";   // ntfy channel the nightly check-in reads
const N = 20;                                // questions per session
const TOL = 0.0001;                          // answers within this count as right (4 d.p.)

const gcd = (a, b) => b ? gcd(b, a % b) : a;
const card = (n, d) => ({ n, d, key: n + "/" + d });
function range(a, b) { const r = []; for (let i = a; i <= b; i++) r.push(i); return r; }
function proper(ds) { const out = []; for (const d of ds) for (let n = 1; n < d; n++) if (gcd(n, d) === 1) out.push(card(n, d)); return out; }

const DECKS = {
  weak: { name: "Weak spots", sub: "1/21, 1/24, 1/27, 1/36, sevenths and your misses from 12 Oct",
    cards: () => ["1/21","1/24","1/27","1/36","23/27","13/21","31/36","9/22","1/14","1/18","4/7","3/7","5/7","6/7","2/7","1/7","5/14","11/14","7/18","13/36"].map(s => card(...s.split("/").map(Number))) },
  core: { name: "Core", sub: "every n/d with d from 2 to 12", cards: () => proper(range(2, 12)) },
  units: { name: "Unit fractions", sub: "1/2 to 1/40", cards: () => range(2, 40).map(d => card(1, d)) },
  split: { name: "Split denominators", sub: "14, 15, 16, 18, 21, 22, 24, 27, 28, 32, 36, 40",
    cards: () => proper([14, 15, 16, 18, 21, 22, 24, 27, 28, 32, 36, 40]) },
  primes: { name: "Awkward primes", sub: "13ths, 17ths, 19ths, 23rds", cards: () => proper([13, 17, 19, 23]) },
};

// Per-device memory: cards you miss or answer slowly come back more often.
const store = { get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
                set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
let weights = store.get("fd-weights", {});
let history = store.get("fd-history", []);

function hint(n, d) {
  const v = (n / d).toFixed(6);
  if (d === 7) return "sevenths cycle 142857 — start where the size fits";
  if (d === 9) return "ninths repeat the top: " + n + n + n + n + "…";
  if (d === 11) return n + " × 0.0909…";
  if (n === 1) {  // split into a fraction you know (denominator 12 or less) divided by a small number
    for (let b = 12; b >= 2; b--) if (d % b === 0 && d / b > 1 && d / b <= 9) return `1/${d} = 1/${b} ÷ ${d / b}`;
  }
  for (const k of [n - 1, n + 1, n - 2, n + 2]) {
    if (k > 0 && k < d && gcd(k, d) > 1) {
      const g = gcd(k, d), diff = n - k;
      return `${n}/${d} = ${k / g}/${d / g} ${diff > 0 ? "+" : "−"} ${Math.abs(diff)}/${d}`;
    }
  }
  return "= " + v;
}

let deckKey, queue, i, t0, timer, results, answered;
const $ = id => document.getElementById(id);

function pick(cards) {
  const w = cards.map(c => weights[c.key] ?? 1);
  const out = [];
  while (out.length < N) {
    let r = Math.random() * w.reduce((a, b) => a + b, 0), j = 0;
    while ((r -= w[j]) > 0) j++;
    const c = cards[j];
    if (out.length && out[out.length - 1].key === c.key && cards.length > 1) continue;
    out.push(c);
  }
  return out;
}

function show(section) { for (const s of ["menu", "drill", "done"]) $(s).hidden = s !== section; }

function start(key) {
  deckKey = key; queue = pick(DECKS[key].cards()); i = 0; results = [];
  show("drill"); ask();
}

function ask() {
  const c = queue[i]; answered = false;
  $("num").textContent = c.n; $("den").textContent = c.d;
  $("count").textContent = `${i + 1} / ${N}`; $("prog").style.width = (100 * i / N) + "%";
  $("ans").value = ""; $("fb").innerHTML = ""; $("next").hidden = true;
  $("ans").disabled = false; $("ans").focus();
  t0 = performance.now(); clearInterval(timer);
  timer = setInterval(() => $("clock").textContent = ((performance.now() - t0) / 1000).toFixed(1) + "s", 100);
}

function submit(e) {
  e.preventDefault();
  if (answered) return next();
  const raw = $("ans").value.trim().replace(",", ".");
  if (!raw) return;
  answered = true; clearInterval(timer);
  const c = queue[i], secs = (performance.now() - t0) / 1000, val = c.n / c.d;
  const got = parseFloat(raw.startsWith(".") ? "0" + raw : raw);
  const ok = Math.abs(got - val) <= TOL;
  results.push({ key: c.key, ok, secs, got: raw });
  const w = weights[c.key] ?? 1;
  weights[c.key] = Math.min(8, Math.max(0.3, ok ? (secs > 8 ? w * 1.3 : w * 0.7) : w * 2));
  store.set("fd-weights", weights);
  $("fb").innerHTML = ok
    ? `<span class="ok">✓ ${val.toFixed(4)} · ${secs.toFixed(1)}s</span>`
    : `<span class="no">✗ ${val.toFixed(6)}</span><span class="hint">${hint(c.n, c.d)}</span>`;
  $("ans").disabled = true; $("next").hidden = false;
  if (ok) setTimeout(() => { if (answered && results.length === i + 1) next(); }, 700);
}

function next() {
  if (!answered) return;
  i++; i < N ? ask() : finish();
}

function finish() {
  show("done"); $("prog").style.width = "100%";
  const right = results.filter(r => r.ok).length;
  const avg = results.reduce((a, r) => a + r.secs, 0) / results.length;
  const slow = results.reduce((a, r) => r.secs > a.secs ? r : a);
  $("sScore").textContent = `${right}/${N}`; $("sAvg").textContent = avg.toFixed(1) + "s";
  $("sSlow").textContent = slow.key;
  const missed = results.filter(r => !r.ok);
  $("misses").innerHTML = missed.map(r => {
    const [n, d] = r.key.split("/").map(Number);
    return `<div class="miss"><b>${r.key} = ${(n / d).toFixed(4)}</b><span>you: ${r.got}</span></div>`;
  }).join("");
  const entry = { at: new Date().toISOString(), deck: deckKey, right, n: N, avg: +avg.toFixed(1),
                  slowest: slow.key, misses: [...new Set(missed.map(r => r.key))] };
  history.push(entry); history = history.slice(-60); store.set("fd-history", history);
  $("logged").textContent = "Logging…";
  fetch("https://ntfy.sh/" + LOG_TOPIC, { method: "POST", headers: { "Title": "fractions" }, body: JSON.stringify(entry) })
    .then(r => $("logged").textContent = r.ok ? "Logged for tonight's check-in." : "Couldn't log this one (saved on this phone).")
    .catch(() => $("logged").textContent = "Couldn't log this one (saved on this phone).");
}

function menu() {
  show("menu");
  $("decks").innerHTML = Object.entries(DECKS).map(([k, d]) =>
    `<button class="deck" data-k="${k}"><b>${d.name}</b><small>${d.sub}</small></button>`).join("");
  for (const b of document.querySelectorAll(".deck")) b.onclick = () => start(b.dataset.k);
  const last = history.slice(-3).reverse();
  $("hist").innerHTML = last.length ? "Recent: " + last.map(h =>
    `${DECKS[h.deck]?.name ?? h.deck} ${h.right}/${h.n}, ${h.avg}s`).join(" · ") : "";
}

$("form").onsubmit = submit;
$("next").onclick = next;
$("again").onclick = () => start(deckKey);
$("back").onclick = menu;
menu();
</script>
</body></html>
